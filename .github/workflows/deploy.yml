name: Chatsim CI and deploy

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: chatsim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chatsim_test
          POSTGRES_PASSWORD: chatsim_test
          POSTGRES_USER: chatsim_test
        options: >-
          --health-cmd "pg_isready -U chatsim_test -d chatsim_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql://chatsim_test:chatsim_test@127.0.0.1:5432/chatsim_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Chatsim
        run: npm run build

      - name: Build Docker image
        run: docker build -t chatsim-ci .

      - name: Smoke-test Docker runtime
        env:
          ADMIN_BOOTSTRAP_EMAIL: admin@example.test
          AUTH_EMAIL_FROM: Chatsim <accounts@example.test>
          AUTH_REGISTRATION_MODE: closed
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
          BETTER_AUTH_URL: https://chatsim.example.test
          DATABASE_URL: postgresql://chatsim_test:chatsim_test@host.docker.internal:5432/chatsim_test
          RESEND_API_KEY: re_ci_not_used_by_health_check
        run: |
          docker run --detach --name chatsim-ci-runtime \
            --add-host host.docker.internal:host-gateway \
            --env ADMIN_BOOTSTRAP_EMAIL \
            --env AUTH_EMAIL_FROM \
            --env AUTH_REGISTRATION_MODE \
            --env BETTER_AUTH_SECRET \
            --env BETTER_AUTH_URL \
            --env DATABASE_URL \
            --env RESEND_API_KEY \
            --publish 3000:3000 \
            chatsim-ci
          trap 'docker logs chatsim-ci-runtime; docker rm --force chatsim-ci-runtime' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Trigger Coolify deployment
        id: trigger
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_WEBHOOK}")"
          deployment_uuid="$(jq -er 'if type == "array" then .[0].deployment_uuid else (.deployment_uuid // .deployments[0].deployment_uuid) end' <<<"${response}")"
          echo "Triggered Coolify deployment ${deployment_uuid}."
          echo "deployment_uuid=${deployment_uuid}" >> "${GITHUB_OUTPUT}"

      - name: Wait for the requested commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 90); do
            if response="$(curl --fail --silent --show-error \
              https://chatsim.philippeho.dev/api/health)"; then
              status="$(jq -r '.status // empty' <<<"${response}")"
              source_commit="$(jq -r '.sourceCommit // empty' <<<"${response}")"
              if [[ "${status}" == "ok" && "${source_commit}" == "${EXPECTED_COMMIT}" ]]; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for ${EXPECTED_COMMIT} to become healthy." >&2
          exit 1

      - name: Smoke-test production
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 https://chatsim.philippeho.dev/api/health
