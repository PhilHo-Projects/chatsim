services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatsim_dev
      POSTGRES_PASSWORD: chatsim_dev
      POSTGRES_USER: chatsim_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatsim_dev -d chatsim_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:54339:5432"
    volumes:
      - chatsim-postgres-dev:/var/lib/postgresql/data
      - ./server/db/init-dev.sql:/docker-entrypoint-initdb.d/init-dev.sql:ro

volumes:
  chatsim-postgres-dev:
